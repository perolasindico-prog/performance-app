<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logo Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@800&display=swap" rel="stylesheet">
  <style>
    body { background: #0C0C0F; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; gap: 48px; padding: 48px 24px; }
    .logo-big { display: flex; align-items: center; gap: 20px; }
    .name { font-family: 'Inter', sans-serif; font-size: 2.2rem; font-weight: 800; letter-spacing: -0.03em; background: linear-gradient(135deg, #E8E8ED, #8B8B96); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .label { font-family: 'Inter', sans-serif; font-size: 0.7rem; color: #4A4A54; letter-spacing: 0.15em; text-transform: uppercase; text-align: center; }
  </style>
</head>
<body>
  <p class="label">Logo grande</p>
  <div class="logo-big">
    <svg width="120" height="120" viewBox="0 0 64 64" fill="none">
      <defs>
        <linearGradient id="g" x1="32" y1="0" x2="32" y2="64">
          <stop offset="0%" stop-color="#F0F0F5"/>
          <stop offset="100%" stop-color="#6B6B76"/>
        </linearGradient>
      </defs>
      <circle cx="32" cy="32" r="26" stroke="url(#g)" stroke-width="2" opacity="0.4"/>
      <polygon points="32,8 38,30 32,26 26,30" fill="url(#g)"/>
      <polygon points="32,56 38,34 32,38 26,34" fill="url(#g)" opacity="0.2"/>
      <circle cx="32" cy="32" r="2.5" fill="url(#g)"/>
    </svg>
    <span class="name">Direcionado</span>
  </div>

  <p class="label">Tamanho sidebar</p>
  <div class="logo-big">
    <svg width="36" height="36" viewBox="0 0 64 64" fill="none">
      <defs>
        <linearGradient id="g2" x1="32" y1="0" x2="32" y2="64">
          <stop offset="0%" stop-color="#F0F0F5"/>
          <stop offset="100%" stop-color="#6B6B76"/>
        </linearGradient>
      </defs>
      <circle cx="32" cy="32" r="26" stroke="url(#g2)" stroke-width="2" opacity="0.4"/>
      <polygon points="32,8 38,30 32,26 26,30" fill="url(#g2)"/>
      <polygon points="32,56 38,34 32,38 26,34" fill="url(#g2)" opacity="0.2"/>
      <circle cx="32" cy="32" r="2.5" fill="url(#g2)"/>
    </svg>
    <span class="name" style="font-size:1.2rem">Direcionado</span>
  </div>

  <p class="label">So o simbolo</p>
  <svg width="200" height="200" viewBox="0 0 64 64" fill="none">
    <defs>
      <linearGradient id="g3" x1="32" y1="0" x2="32" y2="64">
        <stop offset="0%" stop-color="#F0F0F5"/>
        <stop offset="100%" stop-color="#6B6B76"/>
      </linearGradient>
    </defs>
    <circle cx="32" cy="32" r="26" stroke="url(#g3)" stroke-width="2" opacity="0.4"/>
    <polygon points="32,8 38,30 32,26 26,30" fill="url(#g3)"/>
    <polygon points="32,56 38,34 32,38 26,34" fill="url(#g3)" opacity="0.2"/>
    <circle cx="32" cy="32" r="2.5" fill="url(#g3)"/>
  </svg>
</body>
</html>
